name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Needs the macOS 26 SDK for Foundation Models. The tests are deterministic and do not call the model,
    # which GitHub's runners do not have.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Simulated attacks against each policy (no model)
        run: swift run toolguard-eval --simulate
